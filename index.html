const txEntry=(t,i)=>({n:i+1,id:'t'+i,fecha:t.f,glosa:t.glosa,lineas:[{c:t.d,d:t.m,h:0},{c:t.h,d:0,h:t.m}]});

function ledger(entries){
  const L={};
  entries.forEach(e=>e.lineas.forEach(l=>{
    const a=ACC[l.c]; if(!a) return;
    const o=L[l.c]||(L[l.c]={c:l.c,a:a,D:[],H:[],tD:0,tH:0});
    if(l.d>0){o.D.push({n:e.n,m:l.d});o.tD+=l.d}
    if(l.h>0){o.H.push({n:e.n,m:l.h});o.tH+=l.h}
  }));
  Object.values(L).forEach(o=>{const s=o.tD-o.tH;o.saldo=Math.abs(s);o.lado=s>=0?'D':'H'});
  return L;
}
const sorted=L=>Object.values(L).sort((a,b)=>a.c.localeCompare(b.c));
function balanceData(entries){
  const rows=sorted(ledger(entries));
  const t={sd:0,sh:0,dd:0,dh:0};
  rows.forEach(o=>{t.sd+=o.tD;t.sh+=o.tH;if(o.lado==='D')t.dd+=o.saldo;else t.dh+=o.saldo});
  return {rows,t,ok:t.sd===t.sh&&t.dd===t.dh,diff:Math.abs(t.sd-t.sh)};
}
function resultados(entries){
  const L=ledger(entries);
  const cred=c=>L[c]?L[c].tH-L[c].tD:0;
  const ventas=cred('4101'),otros=cred('4102'),costo=-cred('5101');
  const gastos=['5102','5103','5104','5105','5106','5107'].map(c=>({c:c,n:ACC[c].n,v:-cred(c)})).filter(g=>g.v!==0);
  const margen=ventas-costo,totG=gastos.reduce((s,g)=>s+g.v,0),res=margen-totG+otros;
  const sum=(t,sg)=>Object.values(L).filter(o=>o.a.t===t).reduce((s,o)=>s+(o.tD-o.tH)*sg,0);
  return {ventas,otros,costo,gastos,margen,totG,res,act:sum('activo',1),pas:sum('pasivo',-1),pat:sum('patrimonio',-1)};
}

function efecto(e){ return e.lineas.map(l=>{ const a=ACC[l.c]; const side=l.d>0?'D':'H'; const up=side===TIPOS[a.t].lado; return `<span class="fx ${up?'up':'down'}">${up?'▲':'▼'} ${esc(a.n)} ${up?'sube':'baja'}</span>`; }).join(''); }

    iframe.contentWindow.focus(); setTimeout(()=>{iframe.contentWindow.print();document.body.removeChild(iframe)},500);

  const wipe=$('#lab-wipe',el);

  });
  reset();out();
};

<script>
  // Service Worker integrado (permite que funcione sin internet)
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'aprendeya-v1';
      self.addEventListener('install', (e) => { self.skipWaiting(); });
      self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
      self.addEventListener('fetch', (e) => {
        e.respondWith(
          caches.match(e.request).then((response) => {
            return response || fetch(e.request).then((fetchRes) => {
              return caches.open(CACHE_NAME).then((cache) => {
                cache.put(e.request, fetchRes.clone());
                return fetchRes;
              });
            });
          }).catch(() => caches.match('./cuadernocontable.html'))
        );
      });
    `;
    const blob = new Blob([swCode], {type: 'application/javascript'});
    const swURL = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swURL).catch(err => console.log('SW error:', err));
  }
</script>
